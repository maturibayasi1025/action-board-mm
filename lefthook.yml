pre-commit:
  commands:
    biome:
      glob: '*.{js,ts,jsx,tsx}'
      env:
        # Homebrew / システムに加え、nvm や実行環境の node も拾えるようにする
        PATH: /opt/homebrew/bin:/usr/local/bin:/home/ubuntu/.nvm/versions/node/v22.22.2/bin:/exec-daemon:/usr/bin:/bin
      run: node_modules/.bin/biome check --write {staged_files}
      stage_fixed: true


name: Generate Monthly Award Survey

on:
  schedule:
    # 毎月25日 日本時間10:00 (UTC 01:00)
    - cron: '0 1 25 * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  generate-survey:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Award Survey
        env:
          BATCH_ADMIN_KEY: ${{ secrets.BATCH_ADMIN_KEY }}
          NEXT_PUBLIC_APP_ORIGIN: ${{ secrets.NEXT_PUBLIC_APP_ORIGIN }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code="$(curl -sS --fail-with-body -o "$response_file" -w "%{http_code}" \
            -X POST "${NEXT_PUBLIC_APP_ORIGIN}/api/batch/award-survey" \
            -H "Content-Type: application/json" \
            -d "{\"adminKey\": \"${BATCH_ADMIN_KEY}\"}")"

          echo "HTTP Status: ${http_code}"
          echo "Response body:"
          cat "$response_file"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Award Survey Generation Failed - ' + date,
              body: 'The monthly award survey generation workflow failed. Please check the logs.\n\nWorkflow run: ' + runUrl,
              labels: ['bug', 'automated']
            });

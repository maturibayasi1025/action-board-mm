name: Generate Monthly Award Survey

on:
  schedule:
    # 毎月25日 日本時間10:00 (UTC 01:00)
    - cron: '0 1 25 * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  generate-survey:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Award Survey
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_ORIGIN: ${{ secrets.NEXT_PUBLIC_APP_ORIGIN }}
          SLACK_WEBHOOK_URL_AWARD: ${{ secrets.SLACK_WEBHOOK_URL_AWARD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run generate-award-survey

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Award Survey Generation Failed - ' + date,
              body: 'The monthly award survey generation workflow failed. Please check the logs.\n\nWorkflow run: ' + runUrl,
              labels: ['bug', 'automated']
            });

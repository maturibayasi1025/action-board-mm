name: Generate Monthly eNPS Survey

on:
  schedule:
    # 毎月25日 日本時間10:00 (UTC 01:00)
    - cron: '0 1 25 * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  generate-survey:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate eNPS Survey
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATCH_ADMIN_KEY: ${{ secrets.BATCH_ADMIN_KEY }}
          NEXT_PUBLIC_APP_ORIGIN: ${{ secrets.NEXT_PUBLIC_APP_ORIGIN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "${{ secrets.NEXT_PUBLIC_APP_ORIGIN }}/api/batch/enps-survey" \
            -H "Content-Type: application/json" \
            -d "{\"adminKey\": \"${{ secrets.BATCH_ADMIN_KEY }}\"}"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `eNPS Survey Generation Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `The monthly eNPS survey generation workflow failed. Please check the logs.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'automated']
            });

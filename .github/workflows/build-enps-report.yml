name: Build Monthly eNPS Report

on:
  schedule:
    # 毎月1日 日本時間09:00 (UTC 00:00)。前月末で締め切ったアンケートを確定させる
    - cron: '0 0 1 * *'
  workflow_dispatch: # 再生成したいときの手動実行
    inputs:
      year_month:
        description: '対象年月（YYYY-MM）。空なら締切済みで最新のアンケート'
        required: false
        type: string
      force:
        description: '既存スナップショットを再計算して上書きする'
        required: false
        default: false
        type: boolean
      skip_ai:
        description: '自由記述のAI分析を行わない'
        required: false
        default: false
        type: boolean

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build eNPS report snapshots
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENPS_REPORT_AI_API_KEY: ${{ secrets.ENPS_REPORT_AI_API_KEY }}
          ENPS_REPORT_AI_MODEL: ${{ vars.ENPS_REPORT_AI_MODEL }}
          ENPS_REPORT_AI_BASE_URL: ${{ vars.ENPS_REPORT_AI_BASE_URL }}
          ENPS_REPORT_AI_TEMPERATURE: ${{ vars.ENPS_REPORT_AI_TEMPERATURE }}
        run: |
          npm run build-enps-report -- \
            ${{ inputs.year_month && format('--year-month {0}', inputs.year_month) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.skip_ai && '--skip-ai' || '' }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'eNPS Report Build Failed - ' + date,
              body: 'The monthly eNPS report snapshot workflow failed. Please check the logs.\n\nWorkflow run: ' + runUrl,
              labels: ['bug', 'automated']
            });

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F0D800" />
    <title>オフライン — MAISON MARC アクションボード</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #333333;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 360px;
        width: 100%;
      }
      img {
        width: 96px;
        height: 96px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: #666666;
        margin: 0 0 28px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 9999px;
        background: #f0d800;
        color: #333333;
        font-size: 15px;
        font-weight: 700;
        padding: 12px 32px;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="MAISON MARC" />
      <h1>オフラインです</h1>
      <p>
        インターネットに接続できませんでした。<br />
        通信環境を確認して、もう一度お試しください。
      </p>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </div>
  </body>
</html>

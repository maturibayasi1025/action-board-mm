# Cloudflare Pages用設定
name = "action-board-mm"
compatibility_date = "2024-01-01"

# Pages用のビルド出力ディレクトリ
pages_build_output_dir = ".next"

# ファイルサイズ制限
[limits]
max_upload_size_mb = 100

# 除外ファイル
[build.upload]
exclude = [
  "cache/**",
  ".next/cache/**",
  "*.pack",
  "node_modules/**",
  "**/*.map",
  "**/*.tsbuildinfo",
  "**/test-results/**",
  "**/playwright-report/**",
  "**/coverage/**",
  "**/storybook-static/**",
  "**/.DS_Store",
  "**/temp/**",
  "**/raw_data/**",
  "**/poster_data/temp/**",
  "**/*.log"
]

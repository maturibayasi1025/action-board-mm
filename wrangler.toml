# Cloudflare Pages用設定
name = "action-board-mm"
compatibility_date = "2024-01-01"

[build]
command = "npm run build && npx @cloudflare/next-on-pages"

[[build.env]]
NODE_ENV = "production"

# 除外ファイル
[build.upload]
exclude = [
  "cache/**",
  ".next/cache/**",
  "*.pack",
  "node_modules/**",
  "**/*.map",
  "**/*.tsbuildinfo",
  "**/test-results/**",
  "**/playwright-report/**",
  "**/coverage/**",
  "**/storybook-static/**",
  "**/.DS_Store",
  "**/temp/**",
  "**/raw_data/**",
  "**/poster_data/temp/**",
  "**/*.log"
]
